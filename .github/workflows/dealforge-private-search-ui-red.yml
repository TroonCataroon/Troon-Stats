name: DealForge Private Search UI RED

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  red:
    if: github.event_name != 'issues' || github.event.issue.title == '[automation] DealForge Private Search UI RED'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/dealforge-guest-deal-search
      - name: Confirm private access and UI tests fail before implementation
        id: tests
        shell: bash
        run: |
          set +e
          cd dealforge-live
          node --test tests/private-access.test.js tests/private-search-ui.test.js > /tmp/red.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat /tmp/red.log
          exit 0
      - name: Record RED evidence
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_STATUS: ${{ steps.tests.outputs.status }}
        shell: bash
        run: |
          if [ "$TEST_STATUS" = "0" ]; then
            gh issue comment "${{ github.event.issue.number }}" --body "RED verification failed: the tests unexpectedly passed before implementation."
            exit 1
          fi
          gh issue comment "${{ github.event.issue.number }}" --body "RED verified. The private-access and owner-link UI tests failed because the token helper and private search UI are absent."
