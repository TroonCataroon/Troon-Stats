name: DealForge Private Smoke GREEN

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    if: github.event_name != 'issues' || github.event.issue.title == '[automation] DealForge Private Smoke GREEN'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/dealforge-private-smoke
      - name: Run focused smoke contract
        id: focused
        shell: bash
        run: |
          set +e
          cd dealforge-live
          node --test tests/private-smoke-contract.test.js > /tmp/focused.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat /tmp/focused.log
          exit 0
      - name: Run complete verification
        id: full
        if: steps.focused.outputs.status == '0'
        shell: bash
        run: |
          set +e
          cd dealforge-live
          npm run check > /tmp/full.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "count=$(grep '^# tests ' /tmp/full.log | tail -1 | awk '{print $3}')" >> "$GITHUB_OUTPUT"
          echo "passed=$(grep '^# pass ' /tmp/full.log | tail -1 | awk '{print $3}')" >> "$GITHUB_OUTPUT"
          echo "failed=$(grep '^# fail ' /tmp/full.log | tail -1 | awk '{print $3}')" >> "$GITHUB_OUTPUT"
          cat /tmp/full.log
          exit 0
      - name: Publish evidence
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          FOCUSED_STATUS: ${{ steps.focused.outputs.status }}
          FULL_STATUS: ${{ steps.full.outputs.status }}
          TEST_COUNT: ${{ steps.full.outputs.count }}
          TEST_PASSED: ${{ steps.full.outputs.passed }}
          TEST_FAILED: ${{ steps.full.outputs.failed }}
        shell: bash
        run: |
          if [ "$FOCUSED_STATUS" != "0" ]; then
            body="FOCUSED SMOKE CONTRACT FAILED ($FOCUSED_STATUS)."
          elif [ "$FULL_STATUS" != "0" ]; then
            body="FULL VERIFICATION FAILED ($FULL_STATUS)."
          else
            body="GREEN verified. Private smoke contract passed; npm run check completed with $TEST_COUNT tests, $TEST_PASSED passed, $TEST_FAILED failed."
          fi
          gh issue comment "${{ github.event.issue.number }}" --body "$body"
      - name: Enforce gates
        env:
          FOCUSED_STATUS: ${{ steps.focused.outputs.status }}
          FULL_STATUS: ${{ steps.full.outputs.status }}
        run: |
          test "$FOCUSED_STATUS" = "0"
          test "$FULL_STATUS" = "0"
