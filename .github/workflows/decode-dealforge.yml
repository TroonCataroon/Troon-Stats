name: Recover DealForge source

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/decode-dealforge.yml"
  pull_request:
    branches:
      - main
  issues:
    types:
      - opened
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    if: github.event_name != 'issues' || github.event.issue.title == '[automation] Recover DealForge source'
    runs-on: ubuntu-latest
    steps:
      - name: Check out DealForge branch
        uses: actions/checkout@v4
        with:
          ref: dealforge-live
          fetch-depth: 0

      - name: Restore exact production assets
        shell: bash
        run: |
          set -euo pipefail
          production_commit="613fd12e5b79e3609dac6bf2e3eb97a063ef430a"
          git checkout "$production_commit" -- \
            dealforge-live/assets/app-0.txt \
            dealforge-live/assets/app-1.txt \
            dealforge-live/assets/app-2.txt \
            dealforge-live/assets/app-3.txt \
            dealforge-live/assets/styles-0.txt \
            dealforge-live/assets/styles-1.txt \
            dealforge-live/assets/scoring-0.txt

      - name: Decode deployment assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dealforge-live/source

          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import hashlib
          import re
          from pathlib import Path

          root = Path('dealforge-live')
          assets = root / 'assets'
          output = root / 'source'
          output.mkdir(parents=True, exist_ok=True)

          def natural_key(path: Path) -> list[object]:
              return [int(part) if part.isdigit() else part for part in re.split(r'(\d+)', path.name)]

          def decode_base64_gzip(target: str, patterns: list[str], required: bool = True) -> None:
              paths: list[Path] = []
              for pattern in patterns:
                  paths.extend(assets.glob(pattern))
              paths = sorted(set(paths), key=natural_key)
              if not paths:
                  if required:
                      raise FileNotFoundError(f'No chunks found for {target}')
                  return

              encoded = ''.join(path.read_text(encoding='utf-8') for path in paths)
              encoded = ''.join(encoded.split())
              encoded += '=' * (-len(encoded) % 4)
              compressed = base64.b64decode(encoded, validate=False)
              decoded = gzip.decompress(compressed)
              (output / target).write_bytes(decoded)
              print(f'{target}: {len(paths)} chunks, {len(decoded)} decoded bytes')

          def decode_hex_gzip(target: str, pattern: str) -> None:
              paths = sorted(assets.glob(pattern), key=natural_key)
              if not paths:
                  return
              encoded = ''.join(path.read_text(encoding='utf-8') for path in paths)
              encoded = ''.join(encoded.split())
              decoded = gzip.decompress(bytes.fromhex(encoded))
              (output / target).write_bytes(decoded)
              print(f'{target}: {len(paths)} chunks, {len(decoded)} decoded bytes')

          decode_base64_gzip('app.js', ['app-[0-9]*.txt'])
          decode_base64_gzip('styles.css', ['styles-[0-9]*.txt'])
          decode_base64_gzip('scoring.js', ['scoring-[0-9]*.txt'])

          try:
              decode_base64_gzip('runtime.js', ['runtime-[0-9]*.txt'], required=False)
          except Exception as exc:
              print(f'Optional runtime bundle skipped: {exc}')

          try:
              decode_hex_gzip('runtime-from-hex.js', 'runtime-hex-*.txt')
          except Exception as exc:
              print(f'Optional hex runtime bundle skipped: {exc}')

          lines = []
          for path in sorted(output.iterdir()):
              if path.name == 'SHA256SUMS' or not path.is_file():
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f'{digest}  {path.name}')
          (output / 'SHA256SUMS').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit recovered source to DealForge branch
        shell: bash
        run: |
          set -euo pipefail
          git restore dealforge-live/assets
          if git diff --quiet -- dealforge-live/source; then
            echo "Recovered source is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dealforge-live/source
          git commit -m "chore: materialize DealForge source"
          git push origin HEAD:dealforge-live
