name: DealForge Private Smoke RED

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  red:
    if: github.event_name != 'issues' || github.event.issue.title == '[automation] DealForge Private Smoke RED'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/dealforge-private-smoke
      - name: Run smoke contract test
        id: tests
        shell: bash
        run: |
          set +e
          cd dealforge-live
          node --test tests/private-smoke-contract.test.js > /tmp/red.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat /tmp/red.log
          exit 0
      - name: Record RED evidence
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_STATUS: ${{ steps.tests.outputs.status }}
        shell: bash
        run: |
          if [ "$TEST_STATUS" = "0" ]; then
            gh issue comment "${{ github.event.issue.number }}" --body "RED verification failed: smoke contract unexpectedly passed before coverage was added."
            exit 1
          fi
          gh issue comment "${{ github.event.issue.number }}" --body "RED verified. The smoke contract test failed because the private API, migration, token helper, and owner form are not checked by the deployment smoke script."
