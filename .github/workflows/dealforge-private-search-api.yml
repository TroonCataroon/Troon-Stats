name: DealForge Private Search API

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  verify:
    if: github.event_name != 'issues' || github.event.issue.title == '[automation] DealForge Private Search API'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/dealforge-guest-deal-search
      - name: Run private API tests with captured evidence
        id: tests
        shell: bash
        run: |
          set +e
          cd dealforge-live
          node --test tests/deals-api.test.js > /tmp/private-api-tests.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat /tmp/private-api-tests.log
          exit 0
      - name: Record test evidence
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_STATUS: ${{ steps.tests.outputs.status }}
        shell: bash
        run: |
          if [ "$TEST_STATUS" = "0" ]; then
            body='GREEN verified. `node --test tests/deals-api.test.js` passed the owner-token, 401, 403, validation, ranking, empty-result, and upstream-failure tests.'
          else
            body="PRIVATE API TEST FAILED with exit status $TEST_STATUS. The implementation is not accepted. Inspect the workflow log for the complete Node test output."
          fi
          gh issue comment "${{ github.event.issue.number }}" --body "$body"
      - name: Enforce test result
        shell: bash
        env:
          TEST_STATUS: ${{ steps.tests.outputs.status }}
        run: exit "$TEST_STATUS"
