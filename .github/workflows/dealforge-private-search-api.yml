name: DealForge Private Search API

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  verify:
    if: github.event_name != 'issues' || github.event.issue.title == '[automation] DealForge Private Search API'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/dealforge-guest-deal-search
      - name: Run private API tests
        run: cd dealforge-live && node --test tests/deals-api.test.js
      - name: Record GREEN evidence
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --body "GREEN verified. \`node --test tests/deals-api.test.js\` passed the owner-token, 401, 403, validation, ranking, empty-result, and upstream-failure tests."
